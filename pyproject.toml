[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "bm25s>=0.3.12",
    "fastapi>=0.162.5",
    "fastembed>=0.9.1",
    "fire>=0.7.1",
    "langchain-text-splitters>=1.1.3",
    "pydantic>=2.13.5",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "types-tqdm>=4.70.0.20261106",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.mypy]
exclude = ["(^|/)data/", "(^|/)\\.venv/"]

[[tool.mypy.overrides]]
module = ["bm25s", "bm25s.*", "fastembed", "fastembed.*"]
ignore_missing_imports = true
